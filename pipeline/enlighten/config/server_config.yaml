# Enlighten server configuration for the ODIN demo stack.

# Path to data directory
# Use environment variable for local customization: ${ENL_DATA_PATH}
# Set this in a .env file in this directory (see .env.example)
data_path: ${ENL_DATA_PATH}

# Path to logs directory
log_path: ./logs

# Path to files directory (contains public files, templates, views, etc.)
# Use environment variable for local customization: ${ENL_PUBLIC_FILES_PATH}
# Set this in a .env file in this directory (see .env.example)
public_files_path: ${ENL_PUBLIC_FILES_PATH}

# Dataset configuration - defines templates for different dataset types
# This is used by the frontend to determine how to render different dataset types
dataset_config:
  templates:
    - pattern: .*taxprofiler.*
      path: taxprofiler_map.json
    - pattern: .*ssu.*
      path: ssu_map.json
    - pattern: .*amr_data_summary.*
      path: amr_summary.json
    - pattern: .*amr_data.*
      path: amr_map.json
    - pattern: BiomemeAssay.*
      path: biomeme_viewer.json

# Plugins configuration example
# The dataset watchdog handles Windows-mounted / network filesystems
# automatically (it detects them and polls instead of relying on native file
# events — see "auto-enabling polling" in the log). Declare the feather
# plugin explicitly only to TUNE the poll interval. Same plugin name =
# replaces the implicit default.
#
# plugins:
#   - name: feather
#     type: pluggy
#     module: app.plugins.feather_plugin
#     polling_interval_sec: 5             # 0 = automatic; > 0 = force polling every N seconds
#     config:
#       data_dir: ${ENL_DATA_PATH}        # same directory the implicit plugin watches